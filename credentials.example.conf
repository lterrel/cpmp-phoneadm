# Credenciales de ejemplo para PhoneAdm.
# Copiar este archivo como credentials.conf y completar los valores reales.

# Servidor SSH/TFTP usado por `phoneadm.py generate`, opción 1.
HOST=usuario@host-o-dominio
PASS=CAMBIAR_ESTA_CLAVE
DEST_PATH=/ruta/remota/del/phonebook/

# API Yeastar.
PBX_API=https://IP_DE_LA_PBX:8088
USER_API=usuario_api
PASS_API=CAMBIAR_ESTA_CLAVE_API
